<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飞行搭档 · 桌宠</title>
<style>
  @font-face { font-family: FlightFriendsPixel; src: url("fonts/pixel.woff?v=bc564bf6f5") format("woff"); font-display: swap; }
  :root {
    --ink: rgb(52,32,20); --cream: rgb(255,241,208); --sand: rgb(247,214,158); --sun: rgb(255,200,62);
    --leaf: rgb(72,138,66); --forest: rgb(38,92,48); --red: rgb(226,52,52); --paper: rgb(250,222,157);
    --pixel: FlightFriendsPixel, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 12px/1.5 var(--pixel); color: var(--ink);
               -webkit-font-smoothing: none; -webkit-tap-highlight-color: transparent; }
  img.ico { image-rendering: pixelated; vertical-align: -3px; }
  button { font: inherit; color: inherit; }

  /* ---- Three looks: the website (the park room), ?demo (a pretend desktop), the Mac app (see-through) ---- */
  body.site { background: #e9c9a0 url("park/room-wide.png?v=a5a8cb9d0d") center bottom / auto 100% repeat-x; image-rendering: pixelated; }
  body.fake-desktop { background: linear-gradient(#8fc6e8, #cfe7f2 70%, #e8f1d8); }
  body.real-desktop { background: transparent; }
  body.real-desktop .fake-window, body.real-desktop .dock, body.real-desktop #settings { display: none; }
  body.real-desktop.show-settings #settings { display: block; }
  body:not(.real-desktop) #menu .desktop-only { display: none; }
  body.site .fake-window, body.site .dock, body:not(.site) .site-only { display: none !important; }
  .fake-window { position: absolute; background: #fff; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); overflow: hidden; }
  .fake-window .bar { height: 26px; background: #ececec; display: flex; gap: 7px; align-items: center; padding-left: 10px; }
  .fake-window .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; }
  .fake-window .bar i:nth-child(2) { background: #febc2e; } .fake-window .bar i:nth-child(3) { background: #28c840; }
  .fake-window textarea { width: 100%; height: calc(100% - 26px); border: 0; padding: 12px; box-sizing: border-box; font: 14px/1.5 -apple-system, sans-serif; resize: none; outline: none; }
  .dock { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); width: min(420px, 80vw); height: 46px; border-radius: 14px; background: rgba(255,255,255,.45); backdrop-filter: blur(8px); }
  canvas#stage { position: absolute; inset: 0; pointer-events: none; z-index: 3; width: 100%; height: 100%; image-rendering: pixelated; }

  /* ---- The game's pixel panel: cream, ink outline, a solid shadow underneath ---- */
  .panel { position: absolute; z-index: 5; background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .pix-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 12px;
             background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); cursor: pointer;
             text-decoration: none; color: var(--ink); white-space: nowrap; transition: transform .06s; box-sizing: border-box; }
  .pix-btn:hover, .pix-btn.on { background: var(--sun); transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
  .pix-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
  .pix-btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: 0 4px 0 var(--ink); background: var(--cream); }
  .pix-btn.go { background: var(--sun); }               /* Yellow means "go", like Start flying. */
  .pix-btn.go:hover { background: var(--sand); }

  /* ---- Website top bar: back, the green ribbon, pop out ---- */
  .site-bar { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 6; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; pointer-events: none; }
  .site-bar > * { pointer-events: auto; }
  /* The top bar's buttons are game-sized: the same 24px pixel letters as the park's buttons. */
  .site-bar .pix-btn { font-size: 24px; min-height: 52px; padding: 0 16px; }
  .site-bar .pix-btn img.ico { width: 28px; height: 24px; }
  .ribbon { background: var(--leaf); color: var(--cream); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
            font-size: 24px; line-height: 1; padding: 10px 22px; text-shadow: 2px 2px 0 var(--forest); }

  /* ---- The pet card: who's out, how full, coins; pick another below ---- */
  #settings { left: 12px; top: 84px; width: 300px; max-width: calc(100vw - 30px); padding: 10px; box-sizing: border-box; }
  .who { display: flex; align-items: center; gap: 10px; }
  .who canvas { width: 64px; height: 60px; image-rendering: pixelated; background: var(--paper); border: 3px solid var(--ink); flex: none; }
  .who .name { font-size: 24px; line-height: 1.1; }
  .who small { display: block; opacity: .75; }
  .who .grow { flex: 1; min-width: 0; }
  #collapse { min-height: 28px; padding: 0 8px; align-self: flex-start; }
  .stats { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding: 4px 8px; background: var(--paper); border: 3px solid var(--ink); }
  .hearts { display: flex; gap: 3px; }
  .coins { display: flex; align-items: center; gap: 4px; font-size: 24px; line-height: 1; }
  .more { margin-top: 10px; }
  .tabs { display: flex; gap: 6px; }
  .tabs .pix-btn { flex: 1; min-height: 30px; }
  #picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; margin-top: 10px; max-height: 214px; overflow-y: auto; padding: 2px 2px 6px; }
  .pet-card { display: flex; flex-direction: column; align-items: center; padding: 2px 0 0; background: var(--paper); border: 3px solid var(--ink); cursor: pointer; transition: transform .06s; }
  .pet-card canvas { width: 48px; height: 45px; image-rendering: pixelated; }
  .pet-card span { font-size: 12px; line-height: 18px; max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pet-card:hover { transform: translateY(-2px); background: var(--sand); }
  .pet-card.on { background: var(--sun); box-shadow: inset 0 0 0 3px var(--cream); transform: translateY(-2px); }
  .size-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .size-row .pix-btn { min-height: 28px; padding: 0 10px; }
  .tip { margin: 10px 0 0; padding: 6px 8px; border: 3px dashed rgba(52,32,20,.35); cursor: pointer; min-height: 18px; }
  #settings.small .more, #settings.small .tip { display: none; }

  /* ---- Right-click / long-press menu ---- */
  #menu { display: none; width: 190px; padding: 8px; box-sizing: border-box; z-index: 8; }
  #menu h3 { margin: 0 0 6px; font-size: 12px; font-weight: normal; display: flex; justify-content: space-between; gap: 6px; }
  #menu .pix-btn { display: flex; justify-content: flex-start; width: 100%; margin-bottom: 6px; min-height: 32px; }
  #menu .pix-btn:last-child { margin-bottom: 2px; }

  #popped { display: none; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 14px 18px; text-align: center; }
  #popped p { margin: 0 0 10px; }
  body.popped #popped { display: block; }
  body.popped #settings { opacity: .5; pointer-events: none; }

  /* Phones and tablets: just a note to open it on a computer. */
  #phone-note { display: none; left: 50%; top: 40%; transform: translate(-50%, -50%); width: min(300px, calc(100vw - 40px)); padding: 16px; box-sizing: border-box; text-align: center; font-size: 12px; }
  #phone-note b { display: block; font-size: 24px; font-weight: normal; line-height: 1.2; margin-bottom: 8px; }
  #phone-note p { margin: 0 0 12px; }
  body.phone #phone-note { display: block; }
  body.phone #settings, body.phone #menu, body.phone #pop-out, body.phone canvas#stage { display: none !important; }

  /* The pop-out window: just the pet on a little wooden floor. */
  body.pip { background: linear-gradient(#f3dcb4, #f3dcb4 70%, #c98f58 70%); overflow: hidden; }

  @media (max-width: 600px) {
    .ribbon { display: none; }
    .site-bar .pix-btn { font-size: 12px; min-height: 40px; padding: 0 12px; }
    .site-bar .pix-btn img.ico { width: 21px; height: 18px; }
    #settings { top: 68px; width: auto; right: 12px; }
    #picker { max-height: 150px; }
  }
  /* Short screens (a phone on its side, like the game): a slimmer card. */
  @media (max-height: 480px) {
    .site-bar .pix-btn { font-size: 12px; min-height: 40px; }
    .ribbon { font-size: 12px; padding: 8px 14px; }
    #settings { top: 64px; max-height: calc(100% - 76px); overflow-y: auto; }
    #picker { max-height: none; overflow: visible; }
    #menu .pix-btn { min-height: 28px; margin-bottom: 4px; }
  }
</style>
</head>
<body class="site">
  <div class="fake-window" style="left: 46%; top: 26%; width: min(420px, 48vw); height: 40%;">
    <div class="bar"><i></i><i></i><i></i></div>
    <textarea placeholder="在这里打字试试：桌宠会凑过来看你打字。">在这里打字试试，桌宠会凑过来看。</textarea>
  </div>
  <div class="dock"></div>
  <canvas id="stage"></canvas>

  <div class="site-bar site-only">
    <a class="pix-btn" href="./">← 回到游戏</a>
    <div class="ribbon">我的桌宠</div>
    <button class="pix-btn go" id="pop-out"><img class="ico" data-icon="window">带出来</button>
  </div>

  <div class="panel" id="settings">
    <div class="who">
      <canvas id="current-thumb" width="64" height="60"></canvas>
      <div class="grow"><div class="name" id="current-name"></div><small id="current-breed"></small></div>
      <button class="pix-btn" id="collapse">收起</button>
    </div>
    <div class="stats"><span class="hearts" id="hearts" title="饱腹"></span><span class="coins"><img class="ico" data-icon="coin"><b id="coins"></b></span></div>
    <div class="more">
      <div class="tabs" id="kinds"><button class="pix-btn on" data-kind="all">全部</button><button class="pix-btn" data-kind="dog">小狗</button><button class="pix-btn" data-kind="cat">小猫</button></div>
      <div id="picker"></div>
      <div class="size-row">大小 <button class="pix-btn" data-size="1.5">小</button><button class="pix-btn on" data-size="2">中</button><button class="pix-btn" data-size="3">大</button></div>
    </div>
    <p class="tip" id="tip" title="点一下换一条"></p>
  </div>

  <div class="panel" id="menu">
    <h3><span id="menu-title"></span><span id="menu-full"></span></h3>
    <button class="pix-btn" id="feed-bowl"><img class="ico" data-icon="bowl"><span></span></button>
    <button class="pix-btn" id="feed-treat"><img class="ico"><span></span></button>
    <button class="pix-btn" id="pet-sleep"><img class="ico" data-icon="moon"><span>去睡觉</span></button>
    <button class="pix-btn" id="pet-wake"><img class="ico" data-icon="sun"><span>叫醒</span></button>
    <button class="pix-btn" id="pet-settings"><img class="ico" data-icon="paw"><span>换宠物 / 大小</span></button>
    <button class="pix-btn desktop-only" id="pet-quit"><img class="ico" data-icon="x"><span>退出桌宠</span></button>
  </div>

  <div class="panel site-only" id="popped"><p>宠物在小窗里陪你<br>换别的标签页它也在</p><button class="pix-btn go">叫它回来</button></div>

<div class="panel site-only" id="phone-note"><b>请在电脑上打开</b><p>桌宠住在电脑屏幕上，<br>陪你工作和学习。<br>Open this page on a computer.</p><a class="pix-btn go" href="./">回到游戏</a></div>

<script src="pet-data.js?v=48d15230f9"></script>
<script src="desk-pet.js?v=1d34b33ab6"></script>
</body>
</html>
